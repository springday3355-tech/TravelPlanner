name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  mysql-migration:
    name: MySQL migration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: travelplanner_test
          MYSQL_USER: travelplanner
          MYSQL_PASSWORD: integration-test-password
          MYSQL_ROOT_PASSWORD: integration-test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utravelplanner -pintegration-test-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Migrate and validate an empty MySQL database
        env:
          MYSQL_INTEGRATION_TEST: "true"
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/travelplanner_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
          MYSQL_TEST_USERNAME: travelplanner
          MYSQL_TEST_PASSWORD: integration-test-password
        run: ./gradlew test --tests '*MySqlMigrationIntegrationTest' --no-daemon

      - name: Print MySQL migration failure details
        if: failure()
        run: find build/test-results/test -name 'TEST-*.xml' -type f -print -exec cat {} \;
