spring.application.name=TravelPlanner

# H2 콘솔 (로컬 개발 확인용, 운영 프로파일에서는 비활성화할 것)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (로컬 개발용 기본값 - 운영 배포 전 반드시 별도 secret으로 교체/외부화할 것)
jwt.secret=local-dev-only-change-me-before-deploy-please-32bytes-min
jwt.access-token-validity-seconds=3600
