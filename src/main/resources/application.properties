spring.application.name=TravelPlanner

# H2 콘솔 (로컬 개발 확인용, 운영 프로파일에서는 비활성화할 것)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (로컬 개발용 기본값 - 운영 배포 전 반드시 별도 secret으로 교체/외부화할 것)
jwt.secret=local-dev-only-change-me-before-deploy-please-32bytes-min
jwt.access-token-validity-seconds=3600

# Google Places API (New). 키가 없으면 기존 DB 장소만 사용한다.
travelplanner.places.google.enabled=${GOOGLE_PLACES_ENABLED:false}
travelplanner.places.google.api-key=${GOOGLE_PLACES_API_KEY:}
travelplanner.places.google.base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
travelplanner.places.google.connect-timeout-millis=${GOOGLE_PLACES_CONNECT_TIMEOUT_MILLIS:2000}
travelplanner.places.google.request-timeout-millis=${GOOGLE_PLACES_REQUEST_TIMEOUT_MILLIS:5000}
travelplanner.places.google.max-results=${GOOGLE_PLACES_MAX_RESULTS:10}
travelplanner.places.google.max-retries=${GOOGLE_PLACES_MAX_RETRIES:2}
travelplanner.places.google.retry-backoff-millis=${GOOGLE_PLACES_RETRY_BACKOFF_MILLIS:200}

# Google Routes API. 키가 없거나 장애가 발생하면 직선거리 추정으로 자동 전환한다.
travelplanner.routes.google.enabled=${GOOGLE_ROUTES_ENABLED:false}
travelplanner.routes.google.api-key=${GOOGLE_ROUTES_API_KEY:${GOOGLE_PLACES_API_KEY:}}
travelplanner.routes.google.base-url=${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
travelplanner.routes.google.connect-timeout-millis=${GOOGLE_ROUTES_CONNECT_TIMEOUT_MILLIS:2000}
travelplanner.routes.google.request-timeout-millis=${GOOGLE_ROUTES_REQUEST_TIMEOUT_MILLIS:5000}
travelplanner.routes.google.max-retries=${GOOGLE_ROUTES_MAX_RETRIES:2}
travelplanner.routes.google.retry-backoff-millis=${GOOGLE_ROUTES_RETRY_BACKOFF_MILLIS:200}
travelplanner.routes.google.max-elements-per-plan=${GOOGLE_ROUTES_MAX_ELEMENTS_PER_PLAN:120}
travelplanner.routes.google.cache-ttl-seconds=${GOOGLE_ROUTES_CACHE_TTL_SECONDS:1800}
travelplanner.routes.google.cache-max-entries=${GOOGLE_ROUTES_CACHE_MAX_ENTRIES:200}

# OpenAI Responses API. 키가 없으면 AI 일정 수정 엔드포인트는 G005를 반환한다.
travelplanner.ai.openai.enabled=${OPENAI_AI_REVISION_ENABLED:false}
travelplanner.ai.openai.api-key=${OPENAI_API_KEY:}
travelplanner.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
travelplanner.ai.openai.model=${OPENAI_AI_REVISION_MODEL:gpt-6-luna}
travelplanner.ai.openai.reasoning-effort=${OPENAI_AI_REVISION_REASONING_EFFORT:low}
travelplanner.ai.openai.connect-timeout-millis=${OPENAI_CONNECT_TIMEOUT_MILLIS:2000}
travelplanner.ai.openai.request-timeout-millis=${OPENAI_REQUEST_TIMEOUT_MILLIS:15000}
travelplanner.ai.openai.max-retries=${OPENAI_MAX_RETRIES:2}
travelplanner.ai.openai.retry-backoff-millis=${OPENAI_RETRY_BACKOFF_MILLIS:200}
travelplanner.ai.openai.max-output-tokens=${OPENAI_AI_REVISION_MAX_OUTPUT_TOKENS:1200}
travelplanner.ai.openai.max-commands=${OPENAI_AI_REVISION_MAX_COMMANDS:5}
travelplanner.ai.openai.max-prompt-characters=${OPENAI_AI_REVISION_MAX_PROMPT_CHARACTERS:30000}
