spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travelplanner}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MILLIS:30000}

# 운영 스키마는 Flyway만 변경하고 Hibernate는 매핑 정합성만 검사한다.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=false

# 운영 비밀값은 기본값 없이 실행 환경에서 주입한다.
jwt.secret=${JWT_SECRET}

# 요청 본문, 인증 헤더, SQL 바인딩 값을 운영 로그에 남기지 않는다.
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.example.travelplanner=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
