spring.application.name=TravelPlanner

# 테스트 전용 설정. Gradle 표준 규약상 src/test/resources가 src/main/resources보다
# 테스트 실행 클래스패스에서 우선하므로, 별도 profile 지정 없이 모든 테스트에 자동 적용된다.
spring.datasource.url=jdbc:h2:mem:travelplanner-test;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

# JWT (테스트 전용 고정값)
jwt.secret=test-only-secret-key-please-32-bytes-minimum-length
jwt.access-token-validity-seconds=3600
